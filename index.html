const initial=()=>({version:1,settings:{globalHintVisible:false,dailyGoal:5},folders:[{id:'f1',name:'일상 영어',parentId:null},{id:'f2',name:'직장 영어',parentId:null},{id:'f3',name:'생활 표현',parentId:'f1'}],expressions:[],questions:[],sessions:[],answers:[],reviews:[],studyHistory:[]});let data;try{data=JSON.parse(localStorage.getItem(KEY))||initial();if(!Array.isArray(data.expressions)||!Array.isArray(data.folders))throw Error()}catch{data=initial()}data.folders.forEach(f=>{f.parentId=null});save();let page='practice',detail=null,searchTerm='',libraryQuery='',selection=new Set(),expanded=new Set(data.folders.map(f=>f.id)),mode='sentence',session=null,feedback=null,answerDraft='',override=null,usedHint=false,filterReview=false;const id=p=>p+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch{toast('저장 공간이 부족합니다. JSON 백업을 권장합니다.')}}function toast(s){let x=document.createElement('div');x.className='toast';x.textContent=s;document.body.append(x);setTimeout(()=>x.remove(),2700)}function speak(s,other=false){if(!('speechSynthesis'in window)){toast('이 브라우저는 음성 재생을 지원하지 않습니다.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='en-US';u.rate=other?.94:1;u.pitch=other?1.12:1;let voices=speechSynthesis.getVoices().filter(v=>v.lang.startsWith('en'));if(voices.length)u.voice=voices[other&&voices.length>1?1:0];speechSynthesis.speak(u)}function navigate(p){page=p;detail=null;detailFolderExpression=null;render()}function nav(){document.querySelectorAll('#tabs button').forEach((b,i)=>b.classList.toggle('active',(['practice','recommend','library','stats'][i]===page)));document.getElementById('tabs').style.display='flex'}function render(){if(page==='detail'&&detail){let e=data.expressions.find(x=>x.expression.toLowerCase()===detail.expression.toLowerCase());if(detailFolderExpression!==detail.expression){detailFolderId=e?.folderId||'';detailFolderExpression=detail.expression}}nav();let a=document.getElementById('app');a.innerHTML=page==='stats'?statisticsPage():page==='recommend'?recommendPage():page==='detail'?detailView():page==='library'?library():page==='practice'?practice():page==='session'?sessionView():page==='complete'?completeView():settings();document.querySelectorAll('input[data-partial]').forEach(el=>el.indeterminate=true);}function day(){return new Date().toLocaleDateString('en-CA')}function stats(){let dates=[...new Set(data.studyHistory.map(x=>x.date))].sort().reverse(),streak=0,d=new Date();if(!dates.includes(day()))d.setDate(d.getDate()-1);while(dates.includes(d.toLocaleDateString('en-CA'))){streak++;d.setDate(d.getDate()-1)}return {streak,today:data.studyHistory.filter(x=>x.date===day()).length}}function home(){let s=stats();return `<div class="eyebrow">YOUR DAILY ENGLISH</div><h1>표현을 배우고,<br>직접 써보세요.</h1><p class="muted">매일 조금씩, 더 자연스러운 영어를 향해.</p><div class="grid" style="margin:25px 0"><div class="stat"><strong>${data.expressions.length}</strong><small>저장한 표현</small></div><div class="stat"><strong>${data.answers.length}</strong><small>완료한 작문</small></div><div class="stat"><strong>${s.streak}일</strong><small>연속 학습</small></div></div><div class="card hero"><div class="row between"><b>오늘의 학습 목표</b><span>${s.today} / ${data.settings.dailyGoal}문항</span></div><div class="progress" style="margin:15px 0"><div style="width:${Math.min(100,s.today/data.settings.dailyGoal*100)}%"></div></div><button class="btn" onclick="navigate('practice')">영작 연습 시작 →</button></div><div class="section-title"><h2>표현 검색</h2><span class="pill">로컬 데모</span></div><div class="row"><input class="field" id="search" placeholder="영어 단어 또는 표현 입력" value="${esc(searchTerm)}" onkeydown="if(event.key==='Enter')lookup()"><button class="search-icon-btn" aria-label="표현 검색" title="검색" onclick="lookup()">⌕</button></div><p class="hint">저장된 표현과 기본 예시 표현을 검색할 수 있습니다. 새로운 표현의 AI 생성은 아직 연결되지 않았습니다.</p><div class="section-title"><h2>추천 표현</h2></div>${seed.map((e,i)=>`<div class="card recommendation-card" role="button" tabindex="0" aria-label="${esc(e[0])} 상세 보기" onclick="openSeed(${i})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openSeed(${i})}"><div class="grow"><b>${esc(e[0])}</b><div class="muted mini">${esc(e[1])}</div></div><button class="audio-tertiary" aria-label="${esc(e[0])} 발음 듣기" onclick="event.stopPropagation();speak(seed[${i}][0])">▶</button><button class="save-recommend icon-action" aria-label="${esc(e[0])} 저장" onclick="event.stopPropagation();saveSeed(${i})">＋</button></div>`).join('')}`}function statisticsPage(){let s=stats();return `<div class="eyebrow">LEARNING STATS</div><h1>학습 통계</h1><div class="grid" style="margin:22px 0"><div class="stat"><strong>${data.expressions.length}</strong><small>저장한 표현</small></div><div class="stat"><strong>${data.answers.length}</strong><small>완료한 작문</small></div><div class="stat"><strong>${s.streak}일</strong><small>연속 학습</small></div></div><div class="card hero"><div class="row between"><b>오늘의 학습 목표</b><span>${s.today} / ${data.settings.dailyGoal}문항</span></div><div class="progress" style="margin:15px 0"><div style="width:${Math.min(100,s.today/data.settings.dailyGoal*100)}%"></div></div><button class="btn secondary" onclick="navigate('practice')">영작 연습하기 →</button></div><div class="card"><h3>최근 학습 기록</h3>${data.answers.slice(-10).reverse().map(a=>{let q=data.questions.find(q=>q.id===a.questionId);return `<div class="listrow"><div class="grow"><b>${esc(q?.expression||'표현')}</b><div class="muted mini">${esc(a.answer.slice(0,100))}</div></div><span class="hint">${esc(a.createdAt.slice(0,10))}</span></div>`}).join('')||'<div class="empty">아직 학습 기록이 없습니다.</div>'}</div>`} 
function lookup(){searchTerm=document.getElementById('search').value.trim();if(!searchTerm)return;let x=data.expressions.find(x=>x.expression.toLowerCase()===searchTerm.toLowerCase());let i=seed.findIndex(x=>x[0].toLowerCase()===searchTerm.toLowerCase());if(x){detail=x;page='detail';render()}else if(i>=0)openSeed(i);else{let hits=data.expressions.filter(x=>x.expression.toLowerCase().includes(searchTerm.toLowerCase())||x.meaning.includes(searchTerm));if(hits.length){detail=hits[0];page='detail';render();toast('일치하는 저장 표현을 표시합니다.')}else toast('검색 결과가 없습니다. AI 검색 연결 전에는 기본 예시와 저장 표현만 지원합니다.')}}function openSeed(i){let e=seed[i];detail={id:'demo'+i,expression:e[0],meaning:e[1],nuance:e[2],examples:e[3].map((x,j)=>({english:x,korean:e[4][j]}))};page='detail';render()}function saveSeed(i){let e=seed[i];let existing=data.expressions.find(x=>x.expression.toLowerCase()===e[0].toLowerCase());if(existing){toast('이미 저장된 표현입니다.');return}data.expressions.push({id:id('expr'),expression:e[0],meaning:e[1],nuance:e[2],examples:e[3].map((english,j)=>({english,korean:e[4][j]})),folderId:'',createdAt:new Date().toISOString()});save();toast('표현 노트에 저장했습니다.');render()}
function folderOptions(value=''){return `<option value="">분류 없음</option>`+data.folders.map(f=>`<option value="${esc(f.id)}" ${value===f.id?'selected':''}>${f.parentId?'↳ ':''}${esc(f.name)}</option>`).join('')}let detailFolderId='',detailFolderExpression=null;function chooseDetailFolder(fid){detailFolderId=fid;render()}function createDetailFolder(){let name=prompt('새 폴더 이름을 입력하세요');if(!name?.trim())return;name=name.trim();let existing=data.folders.find(f=>f.name.toLowerCase()===name.toLowerCase());if(existing){detailFolderId=existing.id;toast('기존 폴더를 선택했습니다.');render();return}let folder={id:id('folder'),name,parentId:null};data.folders.push(folder);detailFolderId=folder.id;save();render();toast('새 폴더가 생성되었습니다.')}function detailView(){let e=detail;if(!e)return '';let saved=data.expressions.find(x=>x.expression.toLowerCase()===e.expression.toLowerCase());return `<button class="btn ghost small" onclick="navigate('practice')">← 돌아가기</button><div class="card" style="margin-top:20px"><div class="eyebrow">EXPRESSION</div><div class="row between"><h1>${esc(e.expression)}</h1><button class="iconbtn audio-tertiary" aria-label="발음 재생" onclick="speak(detail.expression)">▶</button></div><h3 class="accent">${esc(e.meaning)}</h3><p>${esc(e.nuance)}</p><hr class="divider"><h3>예문</h3>${e.examples.map((x,i)=>`<div class="listrow"><div class="grow"><b>${esc(x.english)}</b><div class="muted mini">${esc(x.korean)}</div></div><button class="iconbtn audio-tertiary" aria-label="발음 재생" onclick="speak(detail.examples[${i}].english)">▶</button></div>`).join('')}<div style="margin-top:20px"><label class="label">저장할 폴더</label><div class="detail-folder-chips" role="group" aria-label="저장할 폴더"><button type="button" class="folder-chip ${!detailFolderId?'active':''}" onclick="chooseDetailFolder('')">미분류</button>${data.folders.map(f=>`<button type="button" class="folder-chip ${detailFolderId===f.id?'active':''}" onclick="chooseDetailFolder('${f.id}')">${esc(f.name)}</button>`).join('')}<button type="button" class="folder-chip new-folder-chip" onclick="createDetailFolder()">＋ 새 폴더</button></div></div><div class="row wrap" style="margin-top:15px"><button class="btn" onclick="storeDetail()">${saved?'폴더 변경 저장':'＋ 표현 노트에 저장'}</button><button class="btn secondary" onclick="practiceOne()">이 표현으로 연습</button></div></div>`}function storeDetail(){let f=detailFolderId,existing=data.expressions.find(x=>x.expression.toLowerCase()===detail.expression.toLowerCase());if(existing)existing.folderId=f;else data.expressions.push({...detail,id:id('expr'),folderId:f,createdAt:new Date().toISOString()});save();toast('표현을 저장했습니다.');render()}function practiceOne(){let x=data.expressions.find(x=>x.expression.toLowerCase()===detail.expression.toLowerCase());if(!x){storeDetail();x=data.expressions.find(x=>x.expression.toLowerCase()===detail.expression.toLowerCase())}selection=new Set([x.id]);practiceCustomSelection=true;page='practice';render()}function descendant(f){let ids=[f],pending=[f];while(pending.length){let p=pending.pop();for(let x of data.folders.filter(x=>x.parentId===p)){ids.push(x.id);pending.push(x.id)}}return ids}function folderTree(parent=null,select=false){return data.folders.filter(f=>f.parentId===parent).map(f=>{let ids=descendant(f.id),expr=data.expressions.filter(x=>ids.includes(x.folderId)),checked=expr.length>0&&expr.every(x=>selection.has(x.id)),partial=expr.some(x=>selection.has(x.id))&&!checked,open=expanded.has(f.id);return `<div class="listrow"><button class="iconbtn" onclick="toggleExpand('${f.id}')">${open?'⌄':'›'}</button>${select?`<input type="checkbox" ${checked?'checked':''} ${partial?'data-partial="1"':''} onchange="selectFolder('${f.id}',this.checked)">`:''}<div class="grow click" onclick="toggleExpand('${f.id}')"><b>📁 ${esc(f.name)}</b> <span class="muted mini">${expr.length}</span></div>${!select?`<button class="iconbtn" onclick="renameFolder('${f.id}')">✎</button>${!f.parentId?`<button class="iconbtn" onclick="addFolder('${f.id}')">＋</button>`:''}<button class="iconbtn" onclick="deleteFolder('${f.id}')">×</button>`:''}</div>${open?`<div class="indent">${folderTree(f.id,select)}${expressionRows(data.expressions.filter(x=>x.folderId===f.id),select)}</div>`:''}`}).join('')}let hiddenMeanings=new Set();function toggleMeaning(i){hiddenMeanings.has(i)?hiddenMeanings.delete(i):hiddenMeanings.add(i);render()}function expressionRows(items,select){return items.map(e=>`<div class="expression-item-card">${select?`<input type="checkbox" ${selection.has(e.id)?'checked':''} onchange="selectExpr('${e.id}',this.checked)">`:''}<div class="grow click" role="button" tabindex="0" onclick="openExpression('${e.id}')" onkeydown="if(event.key==='Enter')openExpression('${e.id}')"><b>${esc(e.expression)}</b>${hiddenMeanings.has(e.id)?'':'<div class="muted mini expression-meaning">'}${hiddenMeanings.has(e.id)?'':esc(e.meaning)}${hiddenMeanings.has(e.id)?'':'</div>'}</div><button class="iconbtn audio-tertiary" aria-label="발음 재생" title="발음 재생" onclick="speakExpr('${e.id}')">▶</button><button class="iconbtn meaning-toggle" aria-label="${hiddenMeanings.has(e.id)?'뜻 보기':'뜻 감추기'}" title="${hiddenMeanings.has(e.id)?'뜻 보기':'뜻 감추기'}" aria-pressed="${hiddenMeanings.has(e.id)}" onclick="toggleMeaning('${e.id}')"><span class="eye-glyph ${hiddenMeanings.has(e.id)?'eye-closed':''}">◉</span></button>${!select?`<button class="iconbtn" aria-label="표현 삭제" title="표현 삭제" onclick="removeExpr('${e.id}')">×</button>`:''}</div>`).join('')}function library(){let filtered=data.expressions.filter(x=>(x.expression+' '+x.meaning).toLowerCase().includes(libraryQuery.toLowerCase())&&(libraryFolder==='all'||(libraryFolder==='none'?!x.folderId:x.folderId===libraryFolder)));return `<div class="eyebrow">EXPRESSION LIBRARY</div><h1>표현 노트</h1><p class="muted">폴더 칩으로 분류하고, 저장한 표현을 관리하세요.</p><div class="row wrap" style="margin:20px 0"><button class="btn secondary" onclick="addFolder(null)">＋ 폴더 만들기</button><button class="btn secondary" onclick="navigate('practice')">영작 연습 →</button></div><div class="folder-chips"><button class="folder-chip ${libraryFolder==='all'?'active':''}" onclick="libraryFolder='all';render()">전체 <span>${data.expressions.length}</span></button>${data.folders.map(f=>`<button class="folder-chip ${libraryFolder===f.id?'active':''}" onclick="libraryFolder='${f.id}';render()">${esc(f.name)} <span>${data.expressions.filter(e=>e.folderId===f.id).length}</span></button>`).join('')}<button class="folder-chip ${libraryFolder==='none'?'active':''}" onclick="libraryFolder='none';render()">미분류</button></div>${libraryFolder!=='all'&&libraryFolder!=='none'?`<div class="folder-tools"><button onclick="renameFolder('${libraryFolder}')">폴더 이름 수정</button><button onclick="deleteFolder('${libraryFolder}')">폴더 삭제</button></div>`:''}<input class="field" placeholder="영어 표현 또는 한국어 뜻 검색" value="${esc(libraryQuery)}" oninput="libraryQuery=this.value;render()"><div class="library-expression-list"><div class="row between"><h3>저장된 표현 <span class="muted">${filtered.length}</span></h3></div>${expressionRows(filtered,false)||'<div class="empty">표현이 없습니다. 영작 연습에서 표현을 저장해 보세요.</div>'}</div>`}let libraryFolder='all';
function toggleExpand(f){expanded.has(f)?expanded.delete(f):expanded.add(f);render()}function addFolder(parent){parent=null;let name=prompt('새 폴더 이름');if(!name?.trim())return;data.folders.push({id:id('folder'),name:name.trim(),parentId:parent});if(parent)expanded.add(parent);save();render()}function renameFolder(fid){let f=data.folders.find(x=>x.id===fid),name=prompt('폴더 이름',f.name);if(name?.trim()){f.name=name.trim();save();render()}}function deleteFolder(fid){let ids=descendant(fid);if(!confirm('폴더를 삭제할까요? 포함된 표현은 삭제되지 않고 미분류로 이동합니다.'))return;data.expressions.forEach(e=>{if(ids.includes(e.folderId))e.folderId=''});data.folders=data.folders.filter(x=>!ids.includes(x.id));if(libraryFolder===fid)libraryFolder='all';save();render()}function openExpression(i){detail=data.expressions.find(x=>x.id===i);page='detail';render()}function speakExpr(i){speak(data.expressions.find(x=>x.id===i).expression)}function removeExpr(i){if(!confirm('표현 노트에서 제거할까요?'))return;data.expressions=data.expressions.filter(x=>x.id!==i);selection.delete(i);save();render()}function moveExpr(i){let x=data.expressions.find(x=>x.id===i),names=data.folders.map((f,j)=>`${j+1}. ${f.name}`).join('\n'),n=prompt('이동할 폴더 번호 (0: 미분류)\n'+names);if(n===null)return;let num=Number(n);if(!Number.isInteger(num)||num<0||num>data.folders.length){toast('유효한 번호를 입력하세요.');return}x.folderId=num?data.folders[num-1].id:'';save();render()}function selectExpr(i,b){practiceCustomSelection=true;b?selection.add(i):selection.delete(i);render()}function selectFolder(fid,b){practiceCustomSelection=true;data.expressions.filter(x=>descendant(fid).includes(x.folderId)).forEach(x=>b?selection.add(x.id):selection.delete(x.id));render()}let pickQuery='';
function pickMatching(e){return (e.expression+' '+e.meaning).toLowerCase().includes(pickQuery.trim().toLowerCase())}
function pickRow(e){return `<label class="pick-expression"><input class="pick-check" type="checkbox" ${selection.has(e.id)?'checked':''} onchange="selectExpr('${e.id}',this.checked)"><span class="pick-expression-text"><strong>${esc(e.expression)}</strong><small>${esc(e.meaning)}</small></span><button type="button" class="pick-audio" aria-label="발음 듣기" onclick="event.preventDefault();speakExpr('${e.id}')">▶</button></label>`}
function pickFolder(f){let ids=descendant(f.id),all=data.expressions.filter(e=>ids.includes(e.folderId)),visible=all.filter(pickMatching);if(pickQuery&&!visible.length)return '';let checked=all.length>0&&all.every(e=>selection.has(e.id)),partial=all.some(e=>selection.has(e.id))&&!checked,open=pickQuery?true:expanded.has(f.id);return `<div class="pick-folder"><div class="pick-folder-head"><button class="pick-expand" aria-label="폴더 펼치기 또는 접기" onclick="toggleExpand('${f.id}')">${open?'⌄':'›'}</button><input class="pick-check" type="checkbox" aria-label="${esc(f.name)} 전체 선택" ${checked?'checked':''} ${partial?'data-partial="1"':''} onchange="selectFolder('${f.id}',this.checked)"><button class="pick-folder-title" onclick="toggleExpand('${f.id}')"><strong>▤ ${esc(f.name)}</strong><small>${all.length}개 표현${partial?' · 일부 선택':''}</small></button></div>${open?`<div class="pick-children">${data.folders.filter(x=>x.parentId===f.id).map(pickFolder).join('')}${data.expressions.filter(e=>e.folderId===f.id&&pickMatching(e)).map(pickRow).join('')}</div>`:''}</div>`}
function updatePickQuery(v){pickQuery=v;let input=document.getElementById('pick-search');let pos=input?.selectionStart;render();let next=document.getElementById('pick-search');if(next){next.focus();next.setSelectionRange(pos,pos)}}
function selectAllVisible(){data.expressions.filter(pickMatching).forEach(e=>selection.add(e.id));render()}
function ensurePracticeSelection(){selection=new Set([...selection].filter(i=>data.expressions.some(e=>e.id===i)));if(!practiceCustomSelection){selection=new Set(data.expressions.map(e=>e.id))}}
let practiceCustomSelection=false,selectionDialog=false;
function openTargetSettings(){ensurePracticeSelection();selectionDialog=true;render()}
function closeTargetSettings(){selectionDialog=false;render()}
function useAllTargets(){practiceCustomSelection=false;selection=new Set(data.expressions.map(e=>e.id));selectionDialog=false;render()}
function confirmTargets(){practiceCustomSelection=true;selectionDialog=false;render()}
function recommendPage(){return `<div class="section-title"><h1>추천 표현</h1></div><div class="section-title"><h2>표현 검색</h2></div><div class="row"><input class="field" id="search" placeholder="영어 단어 또는 표현 입력" value="${esc(searchTerm)}" onkeydown="if(event.key==='Enter')lookup()"><button class="search-icon-btn" aria-label="표현 검색" title="검색" onclick="lookup()">⌕</button></div><div class="section-title"><h2>추천 표현</h2></div>${seed.map((e,i)=>`<div class="card recommendation-card" role="button" tabindex="0" aria-label="${esc(e[0])} 상세 보기" onclick="openSeed(${i})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openSeed(${i})}"><div class="grow"><b>${esc(e[0])}</b><div class="muted mini">${esc(e[1])}</div></div><button class="audio-tertiary" aria-label="${esc(e[0])} 발음 듣기" onclick="event.stopPropagation();speak(seed[${i}][0])">▶</button><button class="save-recommend icon-action" aria-label="${esc(e[0])} 저장" onclick="event.stopPropagation();saveSeed(${i})">＋</button></div>`).join('')}`}function practice(){ensurePracticeSelection();const selected=[...selection];const pending=data.reviews.filter(r=>r.pending).length;const matched=data.expressions.filter(pickMatching);const modes=[['sentence','문장 영작','한국어 문장을 자연스러운 영어로','✎'],['conversation','상황별 응답','메신저 대화에 맞게 영어로 답장하기','◉'],['opinion','의견 라이팅','의견·이유·예시를 갖춘 글 작성하기','▤']];return `<div class="practice-page"><div class="practice-heading"><h1>영작 연습</h1><button class="target-setting" onclick="openTargetSettings()" aria-label="타겟 표현 설정"><span class="target-setting-icon">⚙</span><span class="target-setting-copy"><strong>타겟</strong><small>${practiceCustomSelection?`선택 ${selected.length}`:`전체 ${selected.length}`}</small></span><span class="target-setting-arrow">›</span></button></div><p class="practice-lead">어떤 방식으로 연습할까요?</p><section class="practice-modes"><div class="practice-mode-list">${modes.map(x=>`<button class="practice-mode" onclick="startPracticeMode('${x[0]}')"><span class="mode-icon">${x[3]}</span><span class="mode-copy"><b>${x[1]}</b><small>${x[2]}</small></span><span class="mode-chevron" aria-hidden="true">›</span></button>`).join('')}</div></section>${pending?`<section class="review-banner"><div class="review-symbol">↻</div><div class="review-copy"><b>복습할 문제 ${pending}개</b><span>이전에 풀었던 문제 그대로 다시 연습해요.</span></div><button class="btn secondary small" onclick="startReview()">복습하기 →</button></section>`:''}${selectionDialog?`<div class="target-overlay" onclick="if(event.target===this)closeTargetSettings()"><section class="target-dialog" role="dialog" aria-modal="true" aria-label="타겟 표현 설정"><div class="target-dialog-head"><div><div class="section-kicker">TARGET EXPRESSIONS</div><h2>타겟 표현 설정</h2><p class="muted mini">기본값은 저장된 모든 표현입니다.</p></div><button class="target-close" onclick="closeTargetSettings()" aria-label="닫기">×</button></div><div class="target-presets"><button class="folder-chip ${!practiceCustomSelection?'active':''}" onclick="useAllTargets()">전체 표현 사용</button><span class="muted mini">${selected.length}개 선택 · ${selected.length*3}문항</span></div><div class="pick-toolbar"><input id="pick-search" class="pick-search" type="search" placeholder="영어 표현 또는 한국어 뜻 검색" value="${esc(pickQuery)}" oninput="updatePickQuery(this.value)"><button class="pick-action" onclick="practiceCustomSelection=true;selection.clear();render()">선택 해제</button></div><div class="pick-summary"><span>${matched.length}개 표현</span><button class="pick-all" onclick="practiceCustomSelection=true;selectAllVisible()">검색 결과 전체 선택</button></div><div class="target-list">${data.folders.map(f=>{let all=data.expressions.filter(e=>e.folderId===f.id),visible=all.filter(pickMatching);if(!visible.length)return '';let checked=all.every(e=>selection.has(e.id)),partial=all.some(e=>selection.has(e.id))&&!checked;return `<div class="target-folder-row"><label><input class="pick-check" type="checkbox" ${checked?'checked':''} ${partial?'data-partial="1"':''} onchange="practiceCustomSelection=true;selectFolder('${f.id}',this.checked)"><b>${esc(f.name)}</b><small>${all.length}개</small></label></div>${visible.map(pickRow).join('')}`}).join('')}${(()=>{let all=data.expressions.filter(e=>!e.folderId),visible=all.filter(pickMatching);if(!visible.length)return '';let checked=all.every(e=>selection.has(e.id)),partial=all.some(e=>selection.has(e.id))&&!checked;return `<div class="target-folder-row"><label><input class="pick-check" type="checkbox" ${checked?'checked':''} ${partial?'data-partial="1"':''} onchange="selectUnclassified(this.checked)"><b>미분류</b><small>${all.length}개</small></label></div>${visible.map(pickRow).join('')}`})()}${!matched.length?'<div class="pick-empty">저장된 표현이 없습니다.</div>':''}</div><div class="target-dialog-footer"><button class="btn secondary" onclick="useAllTargets()">전체로 초기화</button><button class="btn" onclick="confirmTargets()">${selected.length}개 표현 적용</button></div></section></div>`:''}</div>`}
function selectUnclassified(checked){practiceCustomSelection=true;data.expressions.filter(e=>!e.folderId).forEach(e=>checked?selection.add(e.id):selection.delete(e.id));render()}
function startPracticeMode(nextMode){mode=nextMode;ensurePracticeSelection();if(!selection.size){toast('먼저 표현 노트에 표현을 저장하거나 타겟 표현을 선택해 주세요.');openTargetSettings();return}selectionDialog=false;startSession()}
function makeQuestion(e,m,n){let ex=e.examples?.[n%e.examples.length],base=e.expression;let q={id:id('question'),expressionId:e.id,expression:base,meaning:e.meaning,mode:m,createdAt:new Date().toISOString(),attempts:[]};if(m==='sentence'){q.prompt=ex?.korean||`'${e.meaning}'라는 의미를 담아 자연스러운 영어 문장을 작성하세요.`;q.model=ex?.english||`Write a natural sentence using "${base}".`}else if(m==='conversation'){let situations=[['동료 Alex','새 업무를 익히는 상황','Have you had a chance to try the new task?','I tried it yesterday, but it was a little confusing.','How is it going now?'],['친구 Jamie','주말 계획을 이야기하는 상황','Do you have any plans for the weekend?','I have a few ideas, but nothing is decided yet.','What would you like to do?'],['동료 Taylor','프로젝트 진행 상황을 확인하는 상황','How is the project coming along?','I made some progress this morning.','Great! What should we do next?']];let s=situations[n%3];q.person=s[0];q.context=s[1];q.messages=[s[2],s[3],s[4]];q.prompt=`${s[1]} — ${base} 표현을 자연스럽게 활용해 네 번째 메시지를 작성하세요.`;q.model=`I'm ${base} — thanks for checking in!`}else{q.prompt=[`What is the best way to learn a new skill? Use "${base}" in your answer.`,`Do you think teamwork is important? Include "${base}" in your response.`,`How can people make better use of their free time? Use "${base}".`][n%3];q.model=`I believe regular practice is important. It helps people build confidence and ${base}. For example, practicing a little every day can make a difficult task easier.`}return q}function startSession(){let xs=[...selection].map(i=>data.expressions.find(e=>e.id===i)).filter(Boolean);if(!xs.length)return;let qs=xs.flatMap(e=>Array.from({length:3},(_,i)=>makeQuestion(e,mode,i)));data.questions.push(...qs);session={id:id('session'),questionIds:qs.map(q=>q.id),selectedExpressionIds:xs.map(e=>e.id),mode,startedAt:new Date().toISOString(),index:0,review:false};data.sessions.push(session);save();page='session';feedback=null;answerDraft='';override=null;usedHint=false;render()}function startReview(){let ids=[...new Set(data.reviews.filter(r=>r.pending).map(r=>r.questionId))].filter(i=>data.questions.some(q=>q.id===i));if(!ids.length){toast('복습할 문제가 없습니다.');return}session={id:id('session'),questionIds:ids,selectedExpressionIds:[],mode:'review',startedAt:new Date().toISOString(),index:0,review:true};data.sessions.push(session);save();page='session';feedback=null;answerDraft='';override=null;usedHint=false;render()}function currentQ(){return data.questions.find(q=>q.id===session.questionIds[session.index])}function hintVisible(){return override??data.settings.globalHintVisible}function toggleHint(){override=!hintVisible();if(override)usedHint=true;render()}function globalHint(v){data.settings.globalHintVisible=v;override=null;if(v)usedHint=true;save();render()}function sessionView(){
 const q=currentQ();if(!q)return '';const visible=hintVisible(),total=session.questionIds.length,idx=session.index+1;
 const label=q.mode==='sentence'?'문장 영작':q.mode==='conversation'?'상황별 응답':'의견 라이팅';
 return `<div class="writing-session compact-session"><div class="session-top"><button class="session-exit" onclick="exitSession()">← 나가기</button><span class="session-counter">${label} · <strong>${idx}</strong> / ${total}</span></div><div class="session-progress" role="progressbar" aria-valuenow="${session.index}" aria-valuemin="0" aria-valuemax="${total}"><span style="width:${session.index/total*100}%"></span></div>
 <label class="global-hint-inline"><input type="checkbox" ${data.settings.globalHintVisible?'checked':''} onchange="globalHint(this.checked)"><span>모든 문제 힌트 표시</span></label>
 <section class="card unified-question-card"><div class="unified-question-header"><span class="question-label">${q.mode==='conversation'?'대화에 답장하기':q.mode==='opinion'?'질문에 답하기':'영어로 옮기기'}</span></div>
 ${q.mode==='conversation'?`<div class="conversation-context">${esc(q.context)} <span>· ${esc(q.person)}</span></div><div class="chat-thread">${q.messages.map((msg,i)=>`<div class="chat-message ${i===1?'own':'other'}"><span class="chat-speaker">${i===1?'나':esc(q.person)}</span><div class="chat-bubble"><span>${esc(msg)}</span><button class="speak-mini audio-tertiary" aria-label="메시지 발음 듣기" onclick="speak(currentQ().messages[${i}],${i!==1})">▶</button></div></div>`).join('')}</div>`:`<div class="question-prompt">${esc(q.prompt)}</div>`}
 <div class="hint-adjacent"><button class="hint-icon-button ${visible?'is-active':''}" aria-label="${visible?'힌트 숨기기':'힌트 보기'}" title="${visible?'힌트 숨기기':'힌트 보기'}" aria-expanded="${visible}" onclick="toggleHint()">?</button>${visible?`<div class="inline-hint"><div><strong>${esc(q.expression)}</strong><span>${esc(q.meaning)}</span></div><button class="audio-tertiary" aria-label="표현 발음 듣기" onclick="speak(currentQ().expression)">▶</button></div>`:''}</div>
 <div class="unified-answer"><textarea id="draft" class="writing-input" aria-label="영어 답변" placeholder="${q.mode==='opinion'?'I believe...':q.mode==='conversation'?'Write your reply...':'Write your sentence in English...'}" oninput="answerDraft=this.value;let c=document.getElementById('word-count');if(c)c.textContent=this.value.trim()?this.value.trim().split(/\s+/).length+' words':'0 words';let b=document.getElementById('submit-btn');if(b)b.disabled=!this.value.trim()" ${feedback?'disabled':''}>${esc(answerDraft)}</textarea><div class="writing-actions"><span id="word-count" class="word-count">${answerDraft.trim().split(/\s+/).filter(Boolean).length} words</span>${!feedback?`<button id="submit-btn" class="btn" onclick="submitAnswer()" ${!answerDraft.trim()?'disabled':''}>답변 확인 →</button>`:`<button class="btn secondary" onclick="rewrite()">↻ 다시 작성</button>`}</div></div></section>${feedback?feedbackView(q):''}</div>`;
}
function toggleSessionSettings(){const el=document.getElementById('session-settings');if(el)el.hidden=!el.hidden;}

function evaluate(q,a){let used=a.toLowerCase().includes(q.expression.toLowerCase());let words=a.trim().split(/\s+/).length;let punct=/[.!?]$/.test(a.trim());let comments=[];if(!used)comments.push('타겟 표현이 답변에 그대로 포함되어 있지 않습니다. 문맥에 맞게 활용해 보세요.');if(!punct)comments.push('문장 끝에 적절한 문장부호를 사용하는 것이 좋습니다.');if(q.mode==='opinion'&&words<20)comments.push('의견, 이유, 구체적인 예시를 더 자세히 작성해 보세요.');if(!comments.length)comments.push('기본 형식 조건을 충족했습니다. 문법과 의미의 정확성은 AI 연결 후 평가할 수 있습니다.');return {corrected:a.trim(),model:q.model,usedTarget:used,needsReview:!used||!punct||(q.mode==='opinion'&&words<20),comments,structure:q.mode==='opinion'?'의견 → 이유 → 예시의 논리적 연결은 AI 연결 후 평가됩니다.':null,offline:true}}function submitAnswer(){let a=document.getElementById('draft')?.value.trim();if(!a)return;answerDraft=a;let q=currentQ();feedback=evaluate(q,a);let attempt={id:id('answer'),questionId:q.id,sessionId:session.id,answer:a,createdAt:new Date().toISOString(),hintUsed:usedHint||hintVisible(),feedback};q.attempts.push(attempt);data.answers.push(attempt);data.studyHistory.push({date:day(),questionId:q.id,sessionId:session.id});let r=data.reviews.find(r=>r.questionId===q.id);if(feedback.needsReview){if(r)r.pending=true;else data.reviews.push({questionId:q.id,pending:true,repeatCount:0});}else if(r){r.pending=false;r.repeatCount++}save();render()}function feedbackView(q){return `<section class="card feedback-panel" id="feedback-section"><div class="feedback-title"><div><div class="section-kicker">YOUR FEEDBACK</div><h2>작성한 답변을 확인해요</h2></div><span class="feedback-tag">로컬 기본 검사</span></div><p class="feedback-disclaimer">AI 첨삭이 연결되지 않아 현재는 표현 일치, 문장부호, 길이 등 기본 항목만 확인합니다.</p><div class="answer-compare"><div class="answer-box"><div class="answer-box-head"><b>내가 작성한 답변</b><button class="speak-mini audio-tertiary" onclick="speak(answerDraft)">▶</button></div><p>${esc(answerDraft)}</p></div><div class="answer-box model"><div class="answer-box-head"><b>참고 답변</b><button class="speak-mini audio-tertiary" onclick="speak(currentQ().model)">▶</button></div><p>${esc(feedback.model)}</p></div></div><div class="feedback-notes"><h3>기본 확인 결과</h3>${feedback.comments.map(x=>`<div class="feedback-note"><span>•</span><p>${esc(x)}</p></div>`).join('')}${feedback.structure?`<div class="feedback-note"><span>•</span><p>${esc(feedback.structure)}</p></div>`:''}</div><div class="feedback-actions"><button class="btn secondary" onclick="markReview()">＋ 복습에 추가</button><button class="btn" onclick="nextQuestion()">${session.index===session.questionIds.length-1?'연습 마치기':'다음 문제 →'}</button></div></section>`}
function markReview(){let q=currentQ(),r=data.reviews.find(x=>x.questionId===q.id);if(r)r.pending=true;else data.reviews.push({questionId:q.id,pending:true,repeatCount:0});save();toast('원본 문제를 복습 대기열에 추가했습니다.')}function rewrite(){feedback=null;render()}function nextQuestion(){if(session.index===session.questionIds.length-1){session.completedAt=new Date().toISOString();save();page='complete'}else{session.index++;feedback=null;answerDraft='';override=null;usedHint=false}render()}function exitSession(){if(!confirm('연습을 나갈까요? 완료된 답변은 저장됩니다.'))return;session=null;page='practice';render()}function completeView(){let count=session?.questionIds.length||0;return `<div class="completion-page"><div class="completion-mark">✓</div><div class="eyebrow">SESSION COMPLETE</div><h1>오늘의 영작을 마쳤어요!</h1><p class="muted">꾸준히 써보는 연습이 표현을 익히는 가장 좋은 방법이에요.</p><div class="completion-stats"><div><strong>${count}</strong><span>완료한 문항</span></div><div><strong>${data.reviews.filter(x=>x.pending).length}</strong><span>복습 대기</span></div></div><div class="completion-actions"><button class="btn" onclick="navigate('practice')">다른 표현 연습하기 →</button><button class="btn secondary" onclick="navigate('practice')">영작 연습으로</button></div></div>`}
function settings(){return `<button class="btn ghost small" onclick="navigate('practice')">← 돌아가기</button><h1>설정 및 학습 기록</h1><div class="card"><h3>학습 설정</h3><label class="label">일일 목표 문항 수</label><input class="field" type="number" min="1" max="100" value="${data.settings.dailyGoal}" onchange="data.settings.dailyGoal=Math.max(1,Math.min(100,Number(this.value)||5));save();render()"><div class="row between" style="margin-top:18px"><span>전체 힌트 기본 표시</span><input type="checkbox" ${data.settings.globalHintVisible?'checked':''} onchange="data.settings.globalHintVisible=this.checked;save()"></div></div><div class="card"><h3>학습 기록</h3><p class="muted">완료한 답변 ${data.answers.length}개 · 복습 대기 ${data.reviews.filter(r=>r.pending).length}개</p>${data.answers.slice(-10).reverse().map(a=>{let q=data.questions.find(q=>q.id===a.questionId);return `<div class="listrow"><div class="grow"><b>${esc(q?.expression||'표현')}</b><div class="muted mini">${esc(a.answer.slice(0,100))}</div></div><span class="hint">${esc(a.createdAt.slice(0,10))}</span></div>`}).join('')||'<div class="empty">아직 학습 기록이 없습니다.</div>'}</div><div class="card"><h3>데이터 백업 및 복원</h3><p class="hint">학습 데이터는 현재 브라우저에만 저장됩니다. 기기를 바꾸거나 브라우저 데이터를 삭제하면 자동으로 복원되지 않습니다.</p><div class="row wrap"><button class="btn" onclick="exportData()">JSON 내보내기</button><button class="btn secondary" onclick="document.getElementById('importFile').click()">JSON 가져오기</button></div></div><div class="card"><h3>AI 기능 연결 상태</h3><p class="muted">현재 비활성화 · API 연결 방식 미확정</p><p class="hint">정적 GitHub Pages에 API 키를 포함하지 않습니다. 표현 검색과 문제·첨삭은 오프라인 예시로 동작합니다.</p></div>`}function exportData(){let b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='writely-backup-'+day()+'.json';a.click();URL.revokeObjectURL(u)}document.getElementById('importFile').addEventListener('change',async function(){let f=this.files[0];if(!f)return;try{let v=JSON.parse(await f.text());let keys=['folders','expressions','questions','sessions','answers','reviews','studyHistory'];if(v.version!==1||!v.settings||!keys.every(k=>Array.isArray(v[k])))throw Error('파일 구조가 올바르지 않습니다.');if(!confirm('현재 데이터를 백업 파일로 덮어쓸까요?'))return;data=v;save();selection.clear();expanded=new Set(data.folders.map(f=>f.id));navigate('practice');toast('복원 완료')}catch(e){toast('가져오기 실패: '+e.message)}finally{this.value=''}});render();
</script></body></html>
